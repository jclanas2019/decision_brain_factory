services:
  brain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BRAIN_MODE: production
      BRAIN_REGISTRY: /models
      BRAIN_API_KEY_FILE: /run/secrets/brain_api_key
      BRAIN_MAX_INFLIGHT: "4"
      BRAIN_REQUESTS_PER_MINUTE: "120"
    volumes:
      - ../registry:/models:ro
    secrets:
      - brain_api_key
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
secrets:
  brain_api_key:
    file: ../secrets/api_key
