name: Verify complete decision brain
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash start.sh check --no-open
      - name: End-to-end demo
        run: |
          set +e
          bash start.sh --no-open
          status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: runs/
