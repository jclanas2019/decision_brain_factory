services:
  brain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BRAIN_ID: comercio.triaje
      BRAIN_MODE: production
      BRAIN_REGISTRY: /models
      BRAIN_API_KEY: ${BRAIN_STACK_WORKER_TOKEN:?Set worker token}
    volumes:
      - ../registry/production:/models:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [python, -m, uvicorn, 'decision_brain.gateway:create_app', --factory, --host, '0.0.0.0', --port, '8443', --workers, '1', --limit-concurrency, '64', --no-access-log, --ssl-certfile, /tls/cert.pem, --ssl-keyfile, /tls/key.pem]
    environment:
      BRAIN_GATEWAY_CONFIG: /app/deploy/gates/gateway.json
      BRAIN_ORCHESTRATOR_TOKEN: ${BRAIN_ORCHESTRATOR_TOKEN:?Set orchestrator token}
      BRAIN_POSTVENTA_TOKEN: ${BRAIN_POSTVENTA_TOKEN:?Set postventa token}
      BRAIN_STACK_WORKER_TOKEN: ${BRAIN_STACK_WORKER_TOKEN:?Set worker token}
    volumes:
      - ../config/gates:/app/config/gates:ro
      - ./gates:/app/deploy/gates:ro
      - ../registry:/app/registry
      - ../registry/production:/app/registry/production:ro
      - ../secrets/tls:/tls:ro
    ports: ['127.0.0.1:8443:8443']
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,ssl; urllib.request.urlopen('https://localhost:8443/ready',context=ssl._create_unverified_context(),timeout=3)"]
      interval: 30s
      timeout: 5s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  observer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [python, -m, uvicorn, 'decision_brain.observer:create_app', --factory, --host, '0.0.0.0', --port, '9100', --workers, '1', --no-access-log]
    environment:
      BRAIN_OBSERVER_CONFIG: /app/deploy/gates/observer.json
      BRAIN_OBSERVER_TOKEN: ${BRAIN_OBSERVER_TOKEN:?Set observer token}
    volumes:
      - ../config/gates:/app/config/gates:ro
      - ./gates:/app/deploy/gates:ro
      - ../registry:/app/registry
      - ../registry/production:/app/registry/production:ro
    ports: ['127.0.0.1:9100:9100']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9100/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
